# Lamplight for Home Assistant's own UI: the header, sidebar and stock cards in the Lamplight colours, so a dashboard
# around the Lamplight cards matches them. The cards don't need it. Copy this file to <config>/themes/ (see README.md).
Lamplight:
  primary-color: "#80d8ff"
  accent-color: "#ffc76b"
  primary-background-color: "#0b0c0f"
  secondary-background-color: "#16181d"
  lovelace-background: "#0b0c0f"
  card-background-color: "#16181d"
  ha-card-background: "#16181d"
  primary-text-color: "#f4f2ee"
  secondary-text-color: "#b9b4ac"
  divider-color: "rgba(255,255,255,.07)"
  app-header-background-color: "#0b0c0f"
  app-header-text-color: "#f4f2ee"
  app-header-selection-bar-color: "#80d8ff"
  app-header-edit-background-color: "#16303a"
  sidebar-background-color: "#0b0c0f"
  sidebar-text-color: "#f4f2ee"
  sidebar-icon-color: "#b9b4ac"
  sidebar-selected-icon-color: "#80d8ff"
  sidebar-selected-text-color: "#80d8ff"
  state-icon-color: "#b9b4ac"
  ha-card-border-radius: "20px"
  ha-card-border-width: "0px"
  mdc-theme-primary: "#80d8ff"
